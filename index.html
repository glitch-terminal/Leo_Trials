<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Leo Trials</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root { box-sizing: border-box; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body {
  height: 100%;
  margin: 0;
  background: #05070a;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Press Start 2P', monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
canvas {
  width: 100%;
  max-width: calc((100vh - 8px) * 16 / 9);
  max-width: calc((100dvh - 8px) * 16 / 9);
  max-height: calc(100vh - 16px);
  max-height: calc(100dvh - 16px);
  image-rendering: pixelated;
  display: block;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
/* Touch controls styled to recede / clear from view when inactive */
.b {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 64px;
  height: 64px;
  box-sizing: border-box;
  border: 2px solid rgba(104, 116, 142, 0.5);
  color: rgba(226, 232, 240, 0.7);
  font: 14px "Press Start 2P", monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(21, 26, 36, 0.35);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  box-shadow: 0 4px 6px rgba(0,0,0,0.4);
  border-radius: 8px;
  z-index: 10;
  opacity: 0.35; /* Fades out so it clears from view over the UI */
  transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}
.b:active, .b.on {
  opacity: 0.95; /* Lights up instantly on touch */
  background: linear-gradient(185deg, #a81c1c 0%, #5c0d0d 100%);
  border-color: #e53e3e;
  color: #fff;
  box-shadow: inset 0 2px 0 #fc8181, 0 4px 6px rgba(0,0,0,0.6);
}
#bl { left: max(16px, env(safe-area-inset-left, 0px)); }
#br { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 74px); }
#bj { right: max(16px, env(safe-area-inset-right, 0px)); width: 88px; }
</style>
</head>
<body>

<canvas id="cv" width="320" height="180"></canvas>
<div class="b" id="bl">&lt;</div>
<div class="b" id="br">&gt;</div>
<div class="b" id="bj">JUMP</div>

<script>
const W=320,H=180,cv=document.getElementById('cv'),x=cv.getContext('2d'),RD='#e11',K={};
let E=[],T=[],P={x:0,y:0,vy:0,on:0,d:1,dead:0},pt=[],gs=1,rv=0,lv=0,deaths=0,t0=0,tm=0,msg='',mt=0,mode=0,fr=0,idle=0,lk=0;
const say=(t,f=150)=>{msg=t;mt=f};
let AC,lives=3,shk=0,tl=0,ta=0,sw=0,jt=0,jc=0,need=0,rl=null;
let mutSeed=0,lastDeathReason='',deathCountMap={},audioVacuum=false,vacuumTimer=0,glitchUI=0,glitchMsg='';

const au=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!='running')AC.resume()}catch(e){}};

// Audio Engine (With Dynamic Vacuum Panic & Heartbeats)
function playTone(freq, duration, type='square', gain=0.1) {
  if (!AC || AC.state !== 'running') return;
  let o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + duration);
}

function heartbeat() {
  if (!AC || AC.state !== 'running') return;
  playTone(60, 0.15, 'sine', 0.25);
  setTimeout(() => playTone(45, 0.2, 'sine', 0.2), 180);
}

function snd(k){
  if(!AC||AC.state!='running')return;
  if(k=='j') playTone(280, 0.12, 'square', 0.08);
  else if(k=='d'){
    let t=AC.currentTime,n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*.25|0,AC.sampleRate),a=b.getChannelData(0),g=AC.createGain();
    for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
    n.buffer=b;g.gain.setValueAtTime(.4,t);g.gain.setValueAtTime(0,t+.25);
    n.connect(g);g.connect(AC.destination);n.start(t);
    playTone(120, 0.25, 'sawtooth', 0.2);
  }
  else playTone(200, 0.3, 'triangle', 0.1);
}

// Chiptune Soundtrack Loop with Audio Vacuuming
setInterval(() => {
  if (mode === 1 && AC && AC.state === 'running') {
    if (audioVacuum) {
      if (fr % 90 === 0) heartbeat();
    } else if (fr % 15 === 0) {
      let notes = [261.63, 329.63, 392.00, 523.25, 349.23, 440.00];
      let note = notes[(fr / 15 | 0) % notes.length];
      playTone(note, 0.08, 'square', 0.03);
    }
  }
}, 100);

function F(a,b,w,h,o){let e={k:0,x:a,y:b,w,h,v:1,a:1,...o};E.push(e);return e}
const S=(a,b,w,h,o)=>F(a,b,w,h,{k:1,...o}),D=(a,b=134,o)=>F(a,b,10,16,{k:2,...o}),tr=(c,f)=>T.push({c,f}),
pad=(a,b,o)=>F(a,b,10,22,{k:3,sh:1,o});

const HD=(a,r)=>{let g=hl(1).filter(q=>q.c!='/').sort((p,q)=>Math.abs(p.x-a-2)-Math.abs(q.x-a-2))[0],
 e=F(g.x,g.y,g.t?7:8,g.t?6:8,{k:5,v:0,hi:g.id,hc:g.c,hg:g.t,dt:0});
 tr(()=>Math.abs(P.x-a)<r,()=>{e.dt=e.fl=1;e.st=150-e.h})};

const LV=[
['EASY, RIGHT?',()=>{
  let f1=F(0,150,130,30), a=F(130,150,24,30), f2=F(154,150,166,30);
  let s=S(262,144,16,6,{v:0,a:0}); D(290);
  tr(()=>P.x>112,()=>{a.a=0;a.fl=1});
  tr(()=>P.x>244,()=>{s.v=s.a=1;say('SURPRISE')})
}],
['LOOK UP',()=>{F(0,150,320,30);F(0,0,320,8);[[90,44],[150,18],[210,40]].forEach(([a,r])=>HD(a,r));D(292)}],
['THE DOOR HAS LEGS',()=>{F(0,150,130,30);F(166,150,154,30);let d=D(288);tr(()=>P.x>236,()=>{d.x=12;say('COME BACK HERE')})}],
['FAKE EXIT',()=>{F(0,150,320,30);F(140,128,28,4);F(182,106,28,4);F(224,84,28,4);F(268,84,52,6);D(296,68);
 F(290,134,10,16,{k:3})}],
['WRONG WAY',()=>{F(0,150,200,30);F(236,150,84,30);S(262,144,12,6);D(292);
 F(100,0,6,150,{k:3,v:0,o:()=>{rv=1;say('CONTROLS FLIPPED')}})}],
['TRUST ISSUES',()=>{F(0,150,40,30);F(280,150,40,30);S(40,168,240,12);D(296);
 for(let i=0;i<7;i++)F(50+i*33,146,26,4,{a:i%2?0:1})}],
['RUN!',()=>{F(0,150,150,30);F(184,150,136,30);S(96,144,12,6);F(200,130,16,20);D(292);let s=S(266,144,12,6,{v:0,a:0});
 S(-70,0,30,H,{wl:1,vx:1.05});tr(()=>P.x>248,()=>{s.v=s.a=1})}],
['UPSIDE DOWN',()=>{F(0,150,320,30);F(0,0,320,10);D(290);S(126,10,24,8,{d:1});S(190,142,32,8);
 pad(84,128,()=>{gs=-1;P.vy=0;say('GRAVITY IS A SUGGESTION')});pad(180,10,()=>{gs=1;P.vy=0})}],
['PATIENCE',()=>{F(0,150,64,30);F(256,150,64,30);F(64,170,192,10);S(64,162,192,8);D(292);let b=F(64,150,192,6,{a:0,v:0});
 tr(()=>idle>150,()=>{b.a=b.v=1;say('GOOD BOY')});tr(()=>fr>700&&!b.a,()=>say('TRY DOING NOTHING',400))}],
['NO MORE TRICKS',()=>{F(0,150,100,30);let a=F(100,150,28,30);F(128,150,100,30);F(262,150,58,30);
 HD(160,36);let r=D(12,134,{a:0,v:0});
 tr(()=>P.x>82,()=>{a.a=0;a.fl=1});
 F(296,134,10,16,{k:3,o:()=>{r.a=r.v=1;say('SIKE. EXIT IS BEHIND YOU',220);S(330,0,30,H,{wl:1,vx:-1.1})}})}]];

function load(n){
  lv=n;E=[];T=[];pt=[];gs=1;rv=0;fr=0;idle=0;shk=tl=ta=sw=jt=jc=need=0;rl=null;
  audioVacuum=false;vacuumTimer=0;
  P={x:12,y:138,vy:0,on:0,d:1,dead:0,h:12};
  
  let title = LV[n][0];
  if (deathCountMap[n] > 2) title = "STILL TRYING?";
  if (deathCountMap[n] > 5) title = "YOU NEVER LEFT";
  say((n+1)+'. '+title);
  
  LV[n][1]();
  if((n+1)%4==0)hrt();
}

function ht(a,b,c){
  x.fillStyle=c;
  [[1,0,2],[4,0,2],[0,1,7],[0,2,7],[1,3,5],[2,4,3],[3,5,1]].forEach(([i,j,w])=>x.fillRect(a+i|0,b+j|0,w,1));
}

function hl(g){
  let o=[],dl=(!g&&deathCountMap[lv]>4&&fr%120<20)?'39':lv+1;
  for(let i=0;i<lives;i++)o.push({id:'h'+i,t:1,c:'',x:95-i*9,y:3});
  [['LV '+dl+'/40',112,'l'],['DEATHS '+deaths,186,'d']].forEach(([s,a,p])=>[...s].forEach((c,i)=>{if(c!=' ')o.push({id:p+(p=='l'?i-s.length:i),t:0,c,x:a+i*8,y:3})}));
  return o}

function spot(){for(let i=0;i<40;i++){let px=40+Math.random()*220|0;if(E.some(e=>e.k==0&&e.a&&e.y==150&&px>=e.x&&px+16<=e.x+e.w))return px}return 0}
function hrt(){let px=spot(),t=Math.random()*3|0;if(!px)return;let p=F(px-4,122,16,4);F(px,113,8,8,{k:4,t,c:0,pl:p})}

function gen(s){
  let pits=[],dd=1;
  const M={
    P:a=>pits.push([a,a+32]),S:a=>S(a,144,12,6),
    T:a=>{let s=S(a,144,12,6,{v:0,a:0});tr(()=>P.x>a-20,()=>{s.v=s.a=1})},
    D:a=>{pits.push([a,a+24]);let f=F(a,150,24,30);tr(()=>P.x>a-24,()=>{f.a=0;f.fl=1})},
    C:a=>HD(a,40),
    B:a=>F(a,130,14,20),G:a=>S(a,134,16,16,{g:1,vx:1,bx:[a,a+80]}),
    W:a=>{let w=F(-30,100,8,50);tr(()=>P.x>a,()=>w.vx=.9)},
    R:a=>{pits.push([a,a+44]);let r=F(a,150,44,6);tr(()=>P.x>a+8&&P.on,()=>r.vx=-1.8)},
    K:a=>tr(()=>P.x>a,()=>shk=150),L:a=>tr(()=>P.x>a,()=>tl=1),
    X:a=>pad(a,128,()=>{P.y-=12;P.h=24;sw=360;say('STRETCH!');E.some(e=>e.k==0&&e.a&&ov(e))&&die('SQUISHED')}),
    U:a=>F(a,104,70,32),J:a=>{D(a,76);dd=0},
    Y:a=>{pits.push([a,a+60]);let b=F(a,150,60,6,{a:0,v:0});tr(()=>idle>150,()=>{b.a=b.v=1;say('GOOD BOY')})},
    E:a=>F(a,134,10,16,{k:3}),
    N:()=>rl=['DO NOT JUMP',()=>K.j],V:()=>rl=['NEVER GO LEFT',()=>K.l],
    Q:()=>rl=['FREEZE ON RED',()=>fr%240>150&&(K.l||K.r||K.j),1],
    I:()=>rl=['KEEP JUMPING',()=>jt>100],A:()=>rl=['NEVER STOP MOVING',()=>idle>40],
    O:()=>{need=5;rl=['JUMP 5 TIMES TO OPEN',()=>0]}
  };
  s.replace(/([A-Z])(\d*)/g,(m,c,n)=>M[c](+n));
  pits.sort((a,b)=>a[0]-b[0]);let p=0;pits.forEach(([a,b])=>{if(a>p)F(p,150,a-p,30);p=Math.max(p,b)});if(p<320)F(p,150,320-p,30);if(dd)D(292);
}

const GN='GEARS 101:G60 S190|SHAKY GROUND:K50 P150 S230|TILT:L60 B130 P200|WALL OF PAIN:W100 P200 S250|DO NOT JUMP:N Y100|STRETCH ME:X40 U110 X210 J280|RED LIGHT:Q S120 S200|BRIDGE OF DOOM:R60 R160|NOT LEFT:V P90 P170 D240|GEAR HELL:G40 G140 B240|WAIT FOR IT:Y90 S210|EARTHQUAKE:K60 D120 P190 S250|KEEP JUMPING:I S100 S160 B220|TALL ORDER:X40 B120 S180 J270|THE SLOPE:L50 D110 P190 S250|NEVER STOP:A G60 B190 P230|PUSH IT:W110 P170 P240|RUBBER BAND:X50 U120 K150 X215 J282|ROLLING STONES:G50 T150 G200|TWO DOORS:S90 B150 E250|BAD ADVICE:O P100 D170 S240|SPIN CYCLE:G30 G130 G220|SHAKE AND BAKE:K40 R90 P190 S250|SLIDE TO DOOM:L40 P120 T190 P230|LONG WAIT:Y60 T200 T250|STAY STRETCHY:X30 U100 X190 G190 J285|COUNT TO FIVE:O W100 P200|NO TURNING BACK:V R50 R150 S250|ALMOST THERE:I G50 R150 K220 P240|THE END?:Q G40 D120 C200 E260';
GN.split('|').forEach(z=>{let[t,m]=z.split(':');LV.push([t,()=>gen(m)])});

function go(){if(mode==1||Date.now()<lk)return;if(mode==3)lives=3;else{lv=0;deaths=0;t0=Date.now();lives=3}mode=1;load(lv)}
function nxt(){snd('w');if(lv>=39){mode=2;lk=Date.now()+1200;tm=(Date.now()-t0)/1000|0}else load(lv+1)}

function die(m){
  if(P.dead)return;
  deaths++;lives--;P.dead=45;snd('d');
  mutSeed++;
  deathCountMap[lv] = (deathCountMap[lv] || 0) + 1;
  
  let taunts = ['NICE TRY','SKILL ISSUE','OUCH','TRUST NOTHING','LEO SAYS NO'];
  if (deathCountMap[lv] > 3) taunts.push('AGAIN?', 'WHY DO YOU PERSIST?', 'FEELS FAMILIAR');
  if (idle > 100) taunts.push('HESITATION IS FATAL', 'YOU FROZE');
  
  if (deaths % 4 === 0) {
    glitchUI = 40;
    glitchMsg = Math.random() > 0.5 ? 'SYSTEM ERROR 0x88' : 'MEMORY CORRUPTED';
  }
  
  say(m || taunts[Math.random()*taunts.length|0], 60);
  for(let i=0;i<24;i++)pt.push({x:P.x+3,y:P.y+6,vx:Math.random()*4-2,vy:Math.random()*-4,l:40});
}

const ov=e=>P.x<e.x+e.w&&P.x+6>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y;

function step(){
  fr++;jt++;if(mt>0)mt--;
  if (glitchUI > 0) glitchUI--;
  
  if (idle > 120 && fr % 180 === 0) {
    say("WAITING WON'T SAVE YOU...", 90);
    audioVacuum = true;
  }
  
  if (idle === 0 && audioVacuum) audioVacuum = false;
  
  for(let e of E){
    if(e.vx){e.x+=e.vx;if(e.bx&&(e.x<e.bx[0]||e.x>e.bx[1]))e.vx=-e.vx}
    if(e.t==1&&e.c<2&&Math.abs(P.x-e.x)<30){e.c++;let q=spot();if(q){e.x=q;e.pl.x=q-4}}
    if(e.fl){e.vy=(e.vy||0)+.35;e.y+=e.vy;if(e.st!=null&&e.y>=e.st){e.y=e.st;e.fl=0}}
  }
  
  pt=pt.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vy+=.2,--p.l>0));
  if(P.dead){if(--P.dead<1){if(lives<1){mode=3;lk=Date.now()+1500;lv-=lv%10}else load(lv)}return}
  
  let l=K.l,r=K.r;if(rv){let t=l;l=r;r=t}
  idle=(K.l||K.r||K.j)?0:idle+1;
  if(rl&&rl[1]())die('RULE BROKEN');
  if(sw>0&&--sw==0){P.h=12;P.y+=12}
  let m=(r?1:0)-(l?1:0);if(m)P.d=m;
  
  let dx=m*1.7+(tl?.7:0)+(shk>0?Math.random()*2.2-.9:0);if(shk>0)shk--;if(tl)ta=Math.min(.1,ta+.002);
  P.x=Math.max(0,Math.min(W-6,P.x+dx));
  
  for(let e of E)if(e.k==0&&e.a&&ov(e))P.x=(e.vx?e.vx<0:dx>0)?e.x-6:e.x+e.w;
  P.vy+=.3*gs;
  if(K.j&&P.on){P.vy=-(P.h>12?5.4:4.6)*gs;jt=0;jc++;snd('j')}
  P.on=0;P.y+=P.vy;
  for(let e of E)if(e.k==0&&e.a&&ov(e)){if(P.vy>0){P.y=e.y-P.h;if(gs>0)P.on=1}else{P.y=e.y+e.h;if(gs<0)P.on=1}P.vy=0}
  
  for(let e of E){
    if(!e.a||P.dead)continue;
    if(e.k==1){if(ov({x:e.x+1,y:e.y+(e.d?0:2),w:e.w-2,h:e.h-2}))die()}
    else if(e.k==5){if(e.dt&&ov(e.hg?{x:e.x-1,y:e.y-1,w:9,h:8}:e))die(e.hg?'HEARTBREAK':'HUD ATTACK')}
    else if(e.k==4){if(ov(e)){e.a=e.v=0;if(e.t==2)die('NOT A HEART');else{lives=Math.min(5,lives+1);say('+1 LIFE')}}}
    else if(e.k>1&&ov(e)){if(e.k==2){if(jc<need){say('JUMP MORE FIRST',50);continue}return nxt()}e.a=0;e.o?e.o():die('WRONG DOOR')}
  }
  for(let t of T)if(!t.d&&t.c()){t.d=1;t.f()}
  if(P.y>H+20||P.y<-40)die('FELL')
}

function tx(s,y,c,z,al='center'){x.font=z+'px "Press Start 2P",monospace';x.textAlign=al;x.fillStyle=c;x.fillText(s,al=='left'?4:al=='right'?W-4:W/2,y)}

function drawDungeonBG() {
  x.fillStyle = '#10141e';
  x.fillRect(0, 0, W, H);
  
  for (let y = 0; y < H; y += 12) {
    let rowShift = (y / 12 % 2 === 0) ? 0 : 10;
    for (let bx = -10; bx < W + 10; bx += 20) {
      let px = bx + rowShift;
      let seed = (px * 3 + y * 7 + mutSeed * 13) % 100;
      
      x.fillStyle = (seed > 85) ? '#182030' : (seed < 15 ? '#0c0f17' : '#141a26');
      x.fillRect(px, y, 19, 11);
      x.fillStyle = '#080a10';
      x.fillRect(px + 19, y, 1, 12);
      x.fillRect(px, y + 11, 20, 1);
      
      if (seed === 42) {
        x.fillStyle = '#05070a';
        x.fillRect(px + 4, y + 3, 2, 5);
        x.fillRect(px + 6, y + 6, 4, 2);
      }
    }
  }
  
  [50, 270].forEach(txPos => {
    x.fillStyle = '#4a3728'; x.fillRect(txPos, 70, 4, 10);
    x.fillStyle = '#8c6f56'; x.fillRect(txPos - 1, 68, 6, 3);
    let flameOffset = (fr / 6 | 0) % 3;
    x.fillStyle = '#ff4500'; x.fillRect(txPos - 1, 60 + flameOffset, 6, 8);
    x.fillStyle = '#ffaa00'; x.fillRect(txPos, 62 + flameOffset, 4, 5);
    x.fillStyle = '#ffffa0'; x.fillRect(txPos + 1, 64 + flameOffset, 2, 2);
  });
}

function drawPlatform(e) {
  let ex = e.x | 0, ey = e.y | 0;
  x.fillStyle = '#2d3748';
  x.fillRect(ex, ey, e.w, e.h);
  x.fillStyle = '#4a5568';
  x.fillRect(ex, ey, e.w, 2);
  
  for (let px = 0; px < e.w; px += 8) {
    let globalX = ex + px;
    let seed = (globalX * 5 + ey * 11) % 10;
    if (seed > 5) {
      x.fillStyle = '#1a202c';
      x.fillRect(ex + px, ey + 4, 6, e.h - 6);
    }
  }
  x.fillStyle = '#1a202c';
  x.fillRect(ex, ey + e.h - 2, e.w, 2);
}

function drawSpikes(e) {
  let n = Math.ceil(e.w / 6), h = e.h;
  for (let i = 0; i < n; i++) {
    let sx = (e.x + i * 6) | 0, sy = e.y | 0;
    for (let r = 0; r < h; r++) {
      let w = Math.max(1, Math.round(6 * (e.d ? h - r : r + 1) / h));
      let px = (sx + (6 - w) / 2) | 0, py = (sy + r) | 0;
      x.fillStyle = (r > h - 4) ? '#a0aec0' : (r < 3 ? '#e53e3e' : '#718096');
      x.fillRect(px, py, w, 1);
    }
  }
}

function drawChest(e) {
  let cx = e.x | 0, cy = e.y | 0;
  x.fillStyle = 'rgba(255, 215, 0, 0.2)';
  x.fillRect(cx - 3, cy - 3, 16, 22);
  x.fillStyle = '#744210'; x.fillRect(cx, cy + 4, 10, 12);
  x.fillStyle = '#d69e2e'; x.fillRect(cx, cy + 2, 10, 4);
  x.fillRect(cx, cy + 8, 10, 2);
  x.fillStyle = '#ecc94b'; x.fillRect(cx + 4, cy + 7, 2, 3);
}

function drawHero() {
  let px = P.x | 0, py = P.y | 0, air = !P.on, walk = (fr >> 3 & 1) && (K.l || K.r) && !air, e = P.h - 12;
  x.save();
  if (gs < 0) { x.translate(0, py * 2 + P.h); x.scale(1, -1); }
  
  let isStaring = idle > 120;
  let faceDir = isStaring ? 0 : P.d;
  
  x.fillStyle = '#2f855a'; x.fillRect(px + 1, py + 4, 4, 5 + e / 2);
  x.fillStyle = '#22543d'; x.fillRect(px + (P.d > 0 ? 0 : 4), py + 5, 2, 4);
  
  x.fillStyle = '#744210'; x.fillRect(px + 1, py, 4, 3);
  x.fillStyle = '#fbd38d'; x.fillRect(px + (faceDir >= 0 ? 2 : 1), py + 2, 3, 2);
  
  x.fillStyle = '#000';
  if (isStaring) {
    x.fillRect(px + 2, py + 2, 1, 1);
    x.fillRect(px + 4, py + 2, 1, 1);
  } else {
    x.fillRect(px + (faceDir > 0 ? 4 : 1), py + 2, 1, 1);
  }
  
  x.fillStyle = '#cbd5e0'; x.fillRect(px + (faceDir >= 0 ? 5 : -1), py + 3, 2, 5);
  x.fillStyle = '#d69e2e'; x.fillRect(px + (faceDir >= 0 ? 5 : -1), py + 7, 2, 1);
  
  x.fillStyle = '#4a5568';
  x.fillRect(px + (air || walk ? 0 : 1), py + 9 + e / 2, 2, 3 + e / 2);
  x.fillRect(px + (air || walk ? 4 : 3), py + 9 + e / 2, 2, 3 + e / 2);
  
  x.restore();
}

function draw(){
  x.fillStyle='#000';x.fillRect(0,0,W,H);x.textBaseline='top';
  
  if(mode==0){
    fr++;
    tx('LEO TRIALS',34,RD,20);
    tx('40 LEVELS. NO MERCY.',80,'#e2e8f0',8);
    tx('TRUST NOTHING',96,'#a0aec0',8);
    if(fr%60<40)tx('TAP OR PRESS ANY KEY',126,RD,8);
    tx(innerHeight>innerWidth?'TURN PHONE SIDEWAYS':'ARROWS/WASD + SPACE',148,'#718096',8);
    return;
  }
  if(mode==3){
    fr++;
    tx('GAME OVER',40,RD,22);
    tx('BACK TO LEVEL '+(lv+1),92,'#fff',8);
    tx('LEO SAYS GIT GUD',108,'#a0aec0',8);
    if(fr%60<40)tx('TAP TO SUFFER AGAIN',146,RD,8);
    return;
  }
  if(mode==2){
    fr++;
    tx('YOU WIN?',40,RD,24);
    tx('DEATHS: '+deaths,88,'#fff',8);
    tx('TIME: '+tm+'S',104,'#fff',8);
    tx('YOU BEAT LEO TRIALS',120,'#fff',8);
    if(fr%60<40)tx('TAP TO SUFFER AGAIN',146,RD,8);
    return;
  }

  x.save();
  x.translate(W/2,H/2);
  x.rotate(ta);
  x.translate(-W/2+(shk>0?Math.random()*4-2:0),-H/2+(shk>0?Math.random()*4-2:0));
  
  drawDungeonBG();

  for(let e of E){
    if(!e.v)continue;
    if(e.k==0) drawPlatform(e);
    else if(e.wl){
      x.fillStyle=RD;x.fillRect(e.x|0,0,e.w,H);let f=e.vx>0;
      for(let y=0;y<H;y+=10)for(let r=0;r<10;r++){let t=r<5?r+1:10-r;x.fillRect((f?e.x+e.w:e.x-t)|0,y+r,t,1)}
    }
    else if(e.g){
      x.save();x.translate(e.x+8,e.y+8);x.rotate(e.x/6);x.fillStyle=RD;x.fillRect(-5,-5,10,10);x.rotate(.785);x.fillRect(-5,-5,10,10);x.fillStyle='#000';x.fillRect(-2,-2,4,4);x.restore()
    }
    else if(e.k==4) ht(e.x,e.y+1,RD);
    else if(e.k==1) drawSpikes(e);
    else if(e.sh){
      x.strokeStyle=RD;x.strokeRect(e.x+.5,e.y+.5,e.w-1,e.h-1);x.font='8px "Press Start 2P",monospace';x.textAlign='left';x.fillStyle=RD;x.fillText('?',e.x+1,e.y+7)
    }
    else drawChest(e);
  }

  if(!P.dead) drawHero();

  x.fillStyle=RD;pt.forEach(p=>x.fillRect(p.x|0,p.y|0,2,2));
  x.restore();

  x.fillStyle = 'rgba(0, 0, 0, 0.4)';
  x.fillRect(0, 0, W, 14);
  x.font='8px "Press Start 2P",monospace';x.textAlign='left';x.fillStyle=RD;
  let gone=E.filter(e=>e.k==5&&e.dt).map(e=>e.hi);
  hl().forEach(g=>{if(!gone.includes(g.id)){if(g.t)ht(g.x,g.y,RD);else x.fillText(g.c,g.x,g.y)}});
  E.forEach(e=>{if(e.k==5&&e.dt){if(e.hg)ht(e.x|0,e.y|0,RD);else x.fillText(e.hc,e.x|0,e.y|0)}});

  if(rl) tx('RULE: '+rl[0],168,RD,8);
  if(rl&&rl[2]&&fr%240>150){
    x.strokeStyle=RD;x.lineWidth=4;x.strokeRect(0,0,W,H);tx('FREEZE!',40,'#fff',8)
  }
  
  if(mt>0) tx(msg,22,'#ffffff',8);

  if (glitchUI > 0) {
    x.fillStyle = 'rgba(255, 0, 0, 0.8)';
    x.fillRect(20, 60, W - 40, 50);
    x.strokeStyle = '#fff';
    x.strokeRect(22, 62, W - 44, 46);
    tx(glitchMsg, 78, '#fff', 8);
  }
}

const key=(e,v)=>{
  let k=e.code;
  if(k=='ArrowLeft'||k=='KeyA')K.l=v;
  else if(k=='ArrowRight'||k=='KeyD')K.r=v;
  else if(k=='ArrowUp'||k=='KeyW'||k=='Space'){K.j=v;e.preventDefault()}
  else if(k=='KeyR'&&v&&mode==1)load(lv);
  if(v)go()
};

addEventListener('keydown',e=>key(e,1));addEventListener('keyup',e=>key(e,0));
[['bl','l'],['br','r'],['bj','j']].forEach(([i,k])=>{
  let b=document.getElementById(i),s=v=>e=>{e.preventDefault();K[k]=v;b.classList.toggle('on',!!v);if(v)go()};
  b.onpointerdown=s(1);['onpointerup','onpointercancel','onpointerleave'].forEach(n=>b[n]=s(0))
});

document.body.addEventListener('pointerdown',go);
['pointerup','touchend','click','keydown'].forEach(n=>addEventListener(n,au));

if(document.fonts){
  document.fonts.load('8px "Press Start 2P"');
  document.fonts.load('20px "Press Start 2P"')
}

let la=performance.now(),ac=0;
(function fm(n){
  ac+=Math.min(n-la,100);la=n;
  while(ac>=16.67){if(mode==1)step();ac-=16.67}
  draw();
  requestAnimationFrame(fm)
})(la);
</script>

</body>
</html>
